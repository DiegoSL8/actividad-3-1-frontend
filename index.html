<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto los papus - Validación y DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Formulario de Contacto</h2>
        
        <div id="mensajeExito" class="success-message oculto"></div>

        <form id="contactoForm">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" placeholder="Ingresa tu nombre">
                <span id="errorNombre" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="correo">Dirección de correo electrónico:</label>
                <input type="text" id="correo" placeholder="ejemplo@correo.com">
                <span id="errorCorreo" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                <span id="errorMensaje" class="error-message"></span>
            </div>

            <button type="submit" class="btn-principal">Enviar Mensaje</button>
        </form>

        <hr class="divisor">
        <div class="info-box">
            <p id="infoTexto">Completa el formulario para enviarnos tu consulta.</p>
            <button type="button" id="btnResaltar" class="btn-secundario">Mostras mas Información</button>
        </div>

    </div>

    <script src="dom.js"></script>
    <script src="script.js"></script>
</body>
</html>
